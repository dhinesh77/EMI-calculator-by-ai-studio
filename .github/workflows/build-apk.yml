name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "EMI & Finance Planner" "com.ddworlds.emiplanner" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMI-Planner-DDWORLDS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
